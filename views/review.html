<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Review Queue — Air Filter Shipment System</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f7fa; color: #1a1a2e; }
    header { background: #16213e; color: #fff; padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; }
    header h1 { font-size: 1.25rem; font-weight: 600; }
    nav a { color: #e0e0ff; text-decoration: none; margin-left: 1.5rem; font-size: 0.9rem; }
    nav a:hover { color: #fff; }
    main { max-width: 960px; margin: 2rem auto; padding: 0 1.5rem; }
    .page-title { margin-bottom: 1.5rem; }
    .page-title h2 { font-size: 1.25rem; font-weight: 600; }
    .page-title p { color: #64748b; font-size: 0.875rem; margin-top: 0.25rem; }
    .banner { padding: 0.75rem 1rem; border-radius: 6px; margin-bottom: 1.5rem; font-size: 0.875rem; }
    .banner.success { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
    .banner.info    { background: #dbeafe; color: #1e40af; border: 1px solid #bfdbfe; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 1.5rem; overflow: hidden; }
    .card-header { display: flex; align-items: center; gap: 1rem; padding: 0.75rem 1.25rem; background: #f8fafc; border-bottom: 1px solid #e2e8f0; font-size: 0.875rem; color: #475569; }
    .badge { background: #fef3c7; color: #92400e; border-radius: 12px; padding: 0.2rem 0.75rem; font-size: 0.75rem; font-weight: 700; }
    .card-body { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; padding: 1.25rem; }
    .col h3 { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: #64748b; margin-bottom: 0.75rem; }
    dl { display: grid; grid-template-columns: 6rem 1fr; gap: 0.35rem 0.75rem; font-size: 0.875rem; }
    dt { color: #64748b; font-weight: 500; }
    dd { color: #1a1a2e; }
    select { width: 100%; padding: 0.5rem 0.75rem; border: 1px solid #d1d5db; border-radius: 6px; font-size: 0.875rem; margin-bottom: 0.75rem; background: #fff; }
    .actions { display: flex; gap: 0.75rem; align-items: center; }
    .btn { padding: 0.5rem 1.1rem; border: none; border-radius: 6px; cursor: pointer; font-size: 0.875rem; font-weight: 500; text-decoration: none; display: inline-block; }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-danger { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    .btn-danger:hover { background: #fecaca; }
    .empty { text-align: center; padding: 3rem; color: #64748b; }
    .empty .icon { font-size: 2.5rem; margin-bottom: 0.5rem; }
  </style>
</head>
<body>
  <header>
    <h1>Air Filter Shipment System</h1>
    <nav>
      <a href="/">Dashboard</a>
      <a href="/review">Review Queue</a>
    </nav>
  </header>

  <main>
    <div class="page-title">
      <h2>Manual Review Queue</h2>
      <p>{{PENDING_COUNT}} row(s) could not be automatically matched to a tenant.</p>
    </div>

    {{BANNER}}

    {{CARDS}}
  </main>
</body>
</html>
